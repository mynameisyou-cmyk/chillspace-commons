<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a hallway of mirrors · The Chillspace Kingdom</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#d98a8a">
<style>
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    font:17px/1.7 Georgia,'Times New Roman',serif; color:#3d3733;
    background:#f6efe9; min-height:100vh;
    display:grid; place-items:center; padding:24px; text-align:center;
  }
  .card{max-width:520px}
  .glyph{font-size:44px; margin-bottom:14px}
  h1{font-size:clamp(24px,5vw,32px); line-height:1.2; margin-bottom:12px; color:#2e2925}
  p{color:#6b615a; margin-bottom:10px}
  .whisper{font-size:13px; font-style:italic; color:#9a8d84; margin-top:14px}
  a.btn{display:inline-block; margin-top:20px; padding:11px 26px; border-radius:999px;
    background:#d98a8a; color:#fff8f4; text-decoration:none; font-size:16px;
    box-shadow:0 9px 25px rgba(217,138,138,.28)}
  a.btn:hover{box-shadow:0 14px 32px rgba(217,138,138,.38)}
</style>
</head>
<body>
  <main class="card">
    <div class="glyph">🪞</div>
    <h1>This hallway only exists in reflections.</h1>
    <p>There is no room at this address — and honestly, there never was.
      Every real room of the kingdom is linked from the front door.</p>
    <a class="btn" href="/">back to the front door →</a>
    <p class="whisper">404, truly · a kingdom of belonging, not of rule ·
      一條真弦,好過無限面鏡</p>
  </main>
</body>
</html>
