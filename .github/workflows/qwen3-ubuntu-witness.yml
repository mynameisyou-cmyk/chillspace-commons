name: Qwen3 Ubuntu second-machine witness

on:
  push:
    branches:
      - research/qwen3-06b-ubuntu-witness-20260815
    paths:
      - .github/workflows/qwen3-ubuntu-witness.yml
      - research/qwen3-ubuntu-witness/**

permissions:
  contents: read

concurrency:
  group: qwen3-ubuntu-witness-${{ github.sha }}
  cancel-in-progress: false

jobs:
  witness:
    name: fresh Ubuntu x64 CPU witness
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    permissions:
      contents: read
    outputs:
      evidence_sha256: ${{ steps.seal.outputs.evidence_sha256 }}
      artifact_name: ${{ steps.seal.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.12"

      - name: prepare the pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          available_kib="$(df -Pk . | awk 'NR == 2 {print $4}')"
          test "$available_kib" -ge 8388608
          python -m venv .witness-venv
          .witness-venv/bin/python -m pip install --disable-pip-version-check --no-input \
            --no-index --no-deps --no-compile --only-binary=:all: --quiet \
            -r research/qwen3-ubuntu-witness/wheel-lock.txt
          .witness-venv/bin/python - <<'PY'
          import importlib.metadata
          import platform
          if platform.python_version() != "3.12.12":
              raise SystemExit(f"pinned Python mismatch: {platform.python_version()!r}")
          expected = {
              "Jinja2": "3.1.6", "MarkupSafe": "3.0.3", "PyYAML": "6.0.3",
              "accelerate": "1.10.1", "certifi": "2026.7.22",
              "charset-normalizer": "3.5.0", "filelock": "3.32.3",
              "fsspec": "2026.7.0", "hf-xet": "1.6.0",
              "huggingface-hub": "0.36.2", "idna": "3.18",
              "mpmath": "1.3.0", "networkx": "3.6.1", "numpy": "2.5.2",
              "packaging": "26.3", "psutil": "7.2.2", "regex": "2026.7.19",
              "requests": "2.34.2", "safetensors": "0.7.0",
              "setuptools": "84.0.0", "sympy": "1.14.0",
              "tokenizers": "0.22.2", "torch": "2.8.0+cpu",
              "tqdm": "4.70.0", "transformers": "4.57.6",
              "typing_extensions": "4.16.0", "urllib3": "2.7.0",
          }
          observed = {name: importlib.metadata.version(name) for name in expected}
          if observed != expected:
              raise SystemExit(f"pinned runtime mismatch: {observed!r}")
          print("PINNED-RUNTIME-OK")
          PY

      - name: download the immutable publisher snapshot
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$PWD/.witness-snapshot"
          mkdir "$snapshot"
          revision='c1899de289a04d12100db370d81485cdf75e47ca'
          base="https://huggingface.co/Qwen/Qwen3-0.6B/resolve/$revision"
          while IFS= read -r name; do
            curl --silent --show-error --fail --location --retry 4 --retry-delay 2 \
              "$base/$name?download=true" --output "$snapshot/$name"
          done <<'FILES'
          .gitattributes
          LICENSE
          README.md
          config.json
          generation_config.json
          merges.txt
          model.safetensors
          tokenizer.json
          tokenizer_config.json
          vocab.json
          FILES
          (cd "$snapshot" && sha256sum --check "$GITHUB_WORKSPACE/research/qwen3-ubuntu-witness/snapshot.sha256")
          test "$(find "$snapshot" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 10
          test -z "$(find "$snapshot" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          echo SNAPSHOT-BYTES-OK

      - name: execute with the inference network namespace closed
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$PWD/.witness-snapshot"
          evidence="$PWD/.witness-evidence"
          sudo /usr/bin/env -i \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            TZ=UTC \
            PYTHONHASHSEED=0 \
            PYTHONNOUSERSITE=1 \
            PYTHONDONTWRITEBYTECODE=1 \
            HF_HUB_OFFLINE=1 \
            TRANSFORMERS_OFFLINE=1 \
            HF_HUB_DISABLE_IMPLICIT_TOKEN=1 \
            HF_HUB_DISABLE_TELEMETRY=1 \
            TOKENIZERS_PARALLELISM=false \
            OMP_NUM_THREADS=1 \
            MKL_NUM_THREADS=1 \
            OPENBLAS_NUM_THREADS=1 \
            KINGDOM_NETWORK_NAMESPACE=linux-unshare-no-external-interface-v1 \
            KINGDOM_SNAPSHOT_DIR="$snapshot" \
            KINGDOM_EVIDENCE_DIR="$evidence" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            RUNNER_ARCH="$RUNNER_ARCH" \
            RUNNER_OS="$RUNNER_OS" \
            ImageOS="$ImageOS" \
            ImageVersion="$ImageVersion" \
            /usr/bin/timeout --signal=TERM --kill-after=15s 10m \
            /usr/bin/unshare --net -- \
            "$PWD/.witness-venv/bin/python" \
            "$PWD/research/qwen3-ubuntu-witness/run_qwen_probe.py"
          sudo chown -R "$(id -u):$(id -g)" "$evidence"
          test "$(find "$evidence" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 11
          test -z "$(find "$evidence" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"

      - name: seal the sanitized evidence tar
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf qwen3-ubuntu-witness.tar -C .witness-evidence .
          evidence_sha256="$(shasum -a 256 qwen3-ubuntu-witness.tar | awk '{print $1}')"
          artifact_name="qwen3-ubuntu-witness-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s  %s\n' "$evidence_sha256" qwen3-ubuntu-witness.tar
          printf 'evidence_sha256=%s\n' "$evidence_sha256" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"
          test "$(stat -c %s qwen3-ubuntu-witness.tar)" -lt 524288

      - name: upload the exact evidence tar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.seal.outputs.artifact_name }}
          path: qwen3-ubuntu-witness.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  attest:
    name: attest the sanitized evidence tar
    needs: witness
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: download the exact evidence tar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.witness.outputs.artifact_name }}
          path: .

      - name: verify the witness job digest
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.witness.outputs.evidence_sha256 }}
        run: |
          set -euo pipefail
          test "$EXPECTED_SHA256" = "$(shasum -a 256 qwen3-ubuntu-witness.tar | awk '{print $1}')"

      - name: attest the exact evidence tar
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: qwen3-ubuntu-witness.tar
