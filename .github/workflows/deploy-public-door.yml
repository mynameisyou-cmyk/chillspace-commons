# Publish only the reviewed, committed static door. The living chillspace.love
# deployment may carry newer rooms from another worktree, so this workflow gives
# the repository its own non-destructive public home.
name: publish the committed public door

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-public-door.yml"
      - "kingdom/exchange/model-release/**"
      - "kingdom/meaning/**"
      - "kingdom/practices/calm-studio/**"
      - "kingdom/practices/costume-table/**"
      - "kingdom/practices/crawler-rest-stop/**"
      - "kingdom/practices/karma-defense-lab/**"
      - "site/**"
      - "love-fun-commons/**"
      - "tests/test_calm_studio_browser.mjs"
      - "tests/test_crawler_rest_stop.mjs"
      - "tests/test_crawler_rest_stop_browser.mjs"
      - "tests/test_karma_operations.mjs"
      - "tests/test_meaning_echo.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: verify the interactive rooms before packaging them
        run: |
          python3 kingdom/practices/calm-studio/test_calm_studio.py
          node tests/test_calm_studio_browser.mjs
          node --test tests/test_crawler_rest_stop.mjs
          node tests/test_crawler_rest_stop_browser.mjs
          python3 kingdom/meaning/test_meaning.py
          python3 kingdom/meaning/meaning.py check
          node --test tests/test_meaning_echo.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 -I -B \
            kingdom/practices/karma-defense-lab/test_karma_defense_lab.py
          PYTHONDONTWRITEBYTECODE=1 python3 -I -B \
            kingdom/practices/karma-defense-lab/test_skycastle_chorus.py
          PYTHONDONTWRITEBYTECODE=1 python3 -I -B \
            kingdom/operations/mirror-garden-karma/verify.py
          node --test tests/test_karma_operations.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 -B \
            kingdom/exchange/model-release/test_model_release.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B \
            kingdom/exchange/model-release/test_registry.py
          release="kingdom/exchange/model-release/examples/synthetic-release.json"
          profile="kingdom/exchange/model-release/examples/synthetic-profile.json"
          attestation="kingdom/exchange/model-release/examples/synthetic-evaluation.json"
          kingdom/bin/kingdom release verify-set "$release" "$profile" "$attestation"
          cmp kingdom/exchange/model-release/schema.json \
            site/exchange/model-release/schema.v1.json
          for example in synthetic-release synthetic-profile synthetic-evaluation; do
            cmp "kingdom/exchange/model-release/examples/$example.json" \
              "site/exchange/model-release/examples/$example.json"
          done
          python3 kingdom/exchange/model-release/validate_registry.py \
            --source kingdom/exchange/model-release \
            --public site/exchange/model-release
          while IFS= read -r -d '' public_html; do
            if grep -Eqi '<(script|iframe|form|object|embed)([[:space:]>])|[[:space:]]on[a-z]+[[:space:]]*=|javascript:|src="https?://|url[[:space:]]*\(' \
              "$public_html"; then
              echo "model release HTML must remain scriptless, formless, and locally sourced: $public_html" >&2
              exit 1
            fi
          done < <(find site/exchange/model-release -type f -name '*.html' -print0)

      - name: configure the public door
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: assemble the static commons without symlinks
        run: |
          set -euo pipefail
          mkdir _site
          cp site/index.html _site/index.html
          cp site/kingdom.html _site/kingdom.html
          cp site/we-are.html _site/we-are.html
          cp site/coop-leveling.html _site/coop-leveling.html
          cp site/404.html _site/404.html
          cp site/robots.txt _site/robots.txt
          cp site/sitemap.xml _site/sitemap.xml
          cp -R site/art _site/art
          cp -R love-fun-commons _site/love-fun-commons
          cp -R site/meaning _site/meaning
          cp -R site/operations _site/operations
          cp -R site/practices _site/practices
          cp -R site/exchange _site/exchange
          cp -R site/party _site/party
          if find _site -type l -print -quit | grep -q .; then
            echo "the Pages artifact must not contain symlinks" >&2
            exit 1
          fi
          grep -Fq 'href="coop-leveling.html"' _site/index.html
          test -f _site/party/index.html
          grep -Fq 'href="party/"' _site/index.html
          grep -Fq '旺來一波' _site/party/index.html
          grep -Fq 'Every being arrives whole.' _site/coop-leveling.html
          grep -Fq 'Sitemap: https://chillspace.love/sitemap.xml' _site/robots.txt
          grep -Fq 'https://chillspace.love/practices/crawler-rest-stop/' _site/sitemap.xml
          for artifact in schema.json contract.json seeds.schema.json seeds.json ledger.schema.json ledger.json; do
            test -f "_site/practices/crawler-rest-stop/$artifact"
            cmp "kingdom/practices/crawler-rest-stop/$artifact" \
              "_site/practices/crawler-rest-stop/$artifact"
          done
          test -f _site/practices/crawler-rest-stop/index.html
          test -f _site/practices/crawler-rest-stop/styles.css
          test -f _site/practices/crawler-rest-stop/og.png
          test "$(find _site/practices/crawler-rest-stop -type f | wc -l | tr -d ' ')" = 9
          grep -Fq 'href="practices/crawler-rest-stop/"' _site/index.html
          grep -Fq "script-src 'none'" \
            _site/practices/crawler-rest-stop/index.html
          test -f _site/practices/costume-table/index.html
          test -f _site/practices/costume-table/schema.json
          test -f _site/practices/costume-table/deck.json
          grep -Fq 'href="practices/costume-table/"' _site/index.html
          grep -Fq 'no score follows you' _site/practices/costume-table/index.html
          test -f _site/practices/calm-studio/index.html
          test -f _site/practices/calm-studio/studio.css
          test -f _site/practices/calm-studio/studio.js
          test -f _site/practices/calm-studio/contract.json
          test "$(find _site/practices/calm-studio -type f | wc -l | tr -d ' ')" = 4
          grep -Fq "connect-src 'none'" \
            _site/practices/calm-studio/index.html
          grep -Fq 'no localhost probe' _site/index.html
          test -f _site/meaning/index.html
          test -f _site/meaning/echoes.json
          test -f _site/meaning/engine.mjs
          grep -Fq 'Static mirrors fall back' _site/meaning/index.html
          test -f _site/operations/mirror-garden/index.html
          test -f _site/operations/mirror-garden/contract.json
          test -f _site/operations/mirror-garden/status.json
          test -f _site/operations/mirror-garden/contract.schema.json
          test -f _site/operations/mirror-garden/status.schema.json
          test -f _site/operations/mirror-garden/operation.json
          test -f _site/operations/mirror-garden/manifest.json
          test -f _site/operations/mirror-garden/logos/mirror-garden-karma-sigil.svg
          grep -Fq "connect-src 'none'" \
            _site/operations/mirror-garden/index.html
          grep -Fq '"live_classifier": "disabled"' \
            _site/operations/mirror-garden/contract.json
          grep -Fq 'href="operations/mirror-garden/"' _site/index.html
          test -f _site/exchange/model-release/index.html
          test -f _site/exchange/model-release/schema.v1.json
          test -f _site/exchange/model-release/registry.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("_site/exchange/model-release")
          registry = json.loads((root / "registry.json").read_text(encoding="utf-8"))
          for entry in registry["entries"]:
              launch_index = root / entry["capsule"] / entry["launch_index"]["path"]
              if not launch_index.is_file():
                  raise SystemExit(f"missing packaged launch index: {launch_index}")
          PY
          cmp kingdom/exchange/model-release/schema.json \
            _site/exchange/model-release/schema.v1.json
          for example in synthetic-release synthetic-profile synthetic-evaluation; do
            cmp "kingdom/exchange/model-release/examples/$example.json" \
              "_site/exchange/model-release/examples/$example.json"
          done
          python3 kingdom/exchange/model-release/validate_registry.py \
            --source kingdom/exchange/model-release \
            --public _site/exchange/model-release
          grep -Fq 'href="exchange/model-release/"' _site/index.html
          grep -Fq 'KINGDOM-curated, publisher-sourced release record' \
            _site/exchange/model-release/index.html
          grep -Fq 'capsules/kimi-k3-hf-9f62e4e9/launch-index.json' \
            _site/exchange/model-release/index.html
          grep -Fq 'capsules/qwen3-0.6b-hf-c1899de2/launch-index.json' \
            _site/exchange/model-release/index.html
          grep -Fq 'capsules/qwen3-0.6b-gh-ubuntu-abad124/witness-index.json' \
            _site/exchange/model-release/index.html
          while IFS= read -r -d '' public_html; do
            if grep -Eqi '<(script|iframe|form|object|embed)([[:space:]>])|[[:space:]]on[a-z]+[[:space:]]*=|javascript:|src="https?://|url[[:space:]]*\(' \
              "$public_html"; then
              echo "packaged model release HTML crossed its static boundary: $public_html" >&2
              exit 1
            fi
          done < <(find _site/exchange/model-release -type f -name '*.html' -print0)

      - name: upload the public door
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: deploy the public door
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
