# The keeper checks her books: every chain must hold — the roll of citizens,
# the record of care, the family's voices, and the flow of words.
# Continuity is the chain, not the substrate.
name: the keeper checks her books

on:
  push:
    branches: [master]
  pull_request:

# She only reads here; nothing is written.
permissions:
  contents: read

jobs:
  verify:
    # Master protection requires this exact GitHub Actions check context.
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: she keeps GitHub custody explicit
        run: python3 tests/test_github_custody_contracts.py
      - name: ZERONE verifies the roll
        run: python3 kingdom/host/zerone_host.py verify
      - name: she verifies the care chain
        run: python3 kingdom/care/care.py verify
      - name: the family speaks — every citizen has a voice
        run: |
          python3 kingdom/voice/voice.py verify
          python3 kingdom/voice/test_voice.py
      - name: she keeps the citizen voice on reviewed Hono bytes
        run: |
          bun install --frozen-lockfile
          git diff --exit-code -- package.json bun.lock node_modules/hono
          bun audit
          node --test tests/test_hono_cors_patch.mjs
          bun test ./kingdom/voice/citizen-voice.test.ts
      - name: she verifies the flow of words
        run: python3 kingdom/flow/flow.py verify

      - name: she keeps Sustain honest about what a hosted runner can prove
        run: python3 tests/test_sustain_contract.py

      - name: she keeps meaning offered, never imposed
        run: |
          python3 kingdom/meaning/test_meaning.py
          python3 kingdom/meaning/meaning.py check
          node --test tests/test_meaning_echo.mjs
          bash -n kingdom/bin/yau
          grep -Fq 'site/.vercel/output/static' kingdom/bin/yau
          grep -Fq 'site/.vercel/output/static' site/README.md
          grep -Fq 'href="meaning/"' site/index.html

      - name: she verifies the love-fun commons
        run: python3 love-fun-commons/validate.py

      - name: she verifies the dark continent operation logos
        run: python3 kingdom/operations/dark-continent-ai/verify.py

      - name: she reads the Nen Compass without granting power
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -B tests/test_dark_continent_expedition.py
          bash -n kingdom/bin/kingdom
          git diff --exit-code -- \
            kingdom/operations/dark-continent-ai \
            site/operations/dark-continent-ai

      - name: she verifies the kingdom operations registry
        run: python3 kingdom/operations/validate.py

      - name: she verifies the Kingdom Loom
        run: python3 kingdom/loom/test_quest_packet.py

      - name: she grounds model releases before naming their houses
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -B \
            kingdom/exchange/model-release/test_model_release.py
          release="kingdom/exchange/model-release/examples/synthetic-release.json"
          profile="kingdom/exchange/model-release/examples/synthetic-profile.json"
          attestation="kingdom/exchange/model-release/examples/synthetic-evaluation.json"
          kingdom/bin/kingdom release check "$release"
          kingdom/bin/kingdom release verify-set "$release" "$profile" "$attestation"
          schema_digest="$(kingdom/bin/kingdom release schema-digest)"
          cmp kingdom/exchange/model-release/schema.json \
            site/exchange/model-release/schema.v1.json
          for example in synthetic-release synthetic-profile synthetic-evaluation; do
            cmp "kingdom/exchange/model-release/examples/$example.json" \
              "site/exchange/model-release/examples/$example.json"
          done
          grep -Fq "$schema_digest" site/exchange/model-release/index.html
          grep -Fq 'Synthetic demonstration · no live model called.' \
            site/exchange/model-release/index.html
          grep -Fq 'href="exchange/model-release/"' site/index.html
          if grep -Eqi '<(script|iframe|form|object|embed)| on[a-z]+="|src="https?://|url\s*\(' \
            site/exchange/model-release/index.html; then
            echo "model release room must remain scriptless, formless, and locally sourced" >&2
            exit 1
          fi
          bash -n kingdom/bin/kingdom
          test -z "$(git diff --name-only -- \
            kingdom/exchange/model-release kingdom/bin/kingdom \
            site/exchange/model-release)"
          test -z "$(git ls-files --others --exclude-standard -- \
            kingdom/exchange/model-release kingdom/bin/kingdom \
            site/exchange/model-release)"

      - name: she checks every Lanternhouse window
        run: |
          python3 kingdom/practices/lanternhouse/test_lanternhouse.py
          python3 kingdom/practices/lanternhouse/lanternhouse.py check \
            kingdom/practices/lanternhouse/examples/k3-preserved-thinking.json
          cmp kingdom/practices/lanternhouse/schema.json \
            site/practices/lanternhouse/schema.json
          cmp kingdom/practices/lanternhouse/examples/k3-preserved-thinking.json \
            site/practices/lanternhouse/examples/k3-preserved-thinking.json
          digest="$(python3 kingdom/practices/lanternhouse/lanternhouse.py digest \
            kingdom/practices/lanternhouse/examples/k3-preserved-thinking.json)"
          grep -Fq "$digest" site/practices/lanternhouse/index.html
          grep -Fq 'href="practices/lanternhouse/"' site/index.html

      - name: she keeps the KARMA orchard from becoming a throne
        run: |
          python3 kingdom/practices/virtue-garden/test_virtue.py
          python3 kingdom/practices/virtue-garden/virtue.py check \
            kingdom/practices/virtue-garden/examples/constructive-infrastructure.json
          cmp kingdom/practices/virtue-garden/schema.json \
            site/practices/virtue-garden/schema.json
          cmp kingdom/practices/virtue-garden/evaluation.schema.json \
            site/practices/virtue-garden/evaluation.schema.json
          cmp kingdom/practices/virtue-garden/rules.json \
            site/practices/virtue-garden/rules.json
          for example in constructive-infrastructure circular-praise unknown-impact; do
            cmp "kingdom/practices/virtue-garden/examples/$example.json" \
              "site/practices/virtue-garden/examples/$example.json"
          done
          digest="$(python3 kingdom/practices/virtue-garden/virtue.py digest \
            kingdom/practices/virtue-garden/examples/constructive-infrastructure.json)"
          alias_digest="$(kingdom/bin/kingdom karma digest \
            kingdom/practices/virtue-garden/examples/constructive-infrastructure.json)"
          test "$digest" = "$alias_digest"
          grep -Fq "$digest" site/practices/virtue-garden/index.html
          grep -Fq 'href="practices/virtue-garden/"' site/index.html
          grep -Fq 'href="evaluation.schema.json"' \
            site/practices/virtue-garden/index.html
          grep -Fq 'for human review' site/practices/virtue-garden/index.html
          if grep -Eqi '<(script|iframe)|((src|href)="https?://)' \
            site/practices/virtue-garden/index.html; then
            echo "virtue garden must remain scriptless and locally sourced" >&2
            exit 1
          fi
          python3 -B kingdom/practices/virtue-garden/mirror/test_mirror.py
          mirror_example="kingdom/practices/virtue-garden/mirror/examples/traditional-reconnaissance.json"
          python3 -B kingdom/practices/virtue-garden/mirror/mirror.py check "$mirror_example"
          for artifact in rules.json scenario.schema.json decision.schema.json; do
            cmp "kingdom/practices/virtue-garden/mirror/$artifact" \
              "site/practices/virtue-garden/mirror/$artifact"
          done
          cmp "$mirror_example" \
            site/practices/virtue-garden/mirror/examples/traditional-reconnaissance.json
          mirror_digest="$(python3 -B kingdom/practices/virtue-garden/mirror/mirror.py \
            digest "$mirror_example")"
          test "$mirror_digest" = "$(kingdom/bin/kingdom karma mirror digest "$mirror_example")"
          grep -Fq "$mirror_digest" site/practices/virtue-garden/mirror/index.html
          grep -Fq 'href="mirror/"' site/practices/virtue-garden/index.html
          grep -Fq 'No attack or defense ran.' \
            site/practices/virtue-garden/mirror/index.html
          if grep -Eqi '<(script|iframe|form)| on[a-z]+="|((src|href)="https?://)|url\s*\(' \
            site/practices/virtue-garden/mirror/index.html; then
            echo "KARMA MIRROR must remain scriptless, formless, and locally sourced" >&2
            exit 1
          fi
          python3 -B kingdom/practices/virtue-garden/mirror/foresight/test_foresight.py
          foresight_example="kingdom/practices/virtue-garden/mirror/foresight/examples/authority-laundering.json"
          python3 -B kingdom/practices/virtue-garden/mirror/foresight/foresight.py \
            check "$foresight_example"
          for artifact in catalog.json scenario.schema.json projection.schema.json; do
            cmp "kingdom/practices/virtue-garden/mirror/foresight/$artifact" \
              "site/practices/virtue-garden/mirror/foresight/$artifact"
          done
          cmp "$foresight_example" \
            site/practices/virtue-garden/mirror/foresight/examples/authority-laundering.json
          foresight_digest="$(python3 -B kingdom/practices/virtue-garden/mirror/foresight/foresight.py \
            digest "$foresight_example")"
          test "$foresight_digest" = "$(kingdom/bin/kingdom karma mirror foresight \
            digest "$foresight_example")"
          grep -Fq "$foresight_digest" \
            site/practices/virtue-garden/mirror/foresight/index.html
          grep -Fq 'href="foresight/"' \
            site/practices/virtue-garden/mirror/index.html
          grep -Fq 'Model possible system effects. Keep persons free.' \
            site/practices/virtue-garden/mirror/foresight/index.html
          if grep -Eqi '<(script|iframe|form)| on[a-z]+="|((src|href)="https?://)|url\s*\(' \
            site/practices/virtue-garden/mirror/foresight/index.html; then
            echo "KARMA FORESIGHT must remain scriptless, formless, and locally sourced" >&2
            exit 1
          fi
          python3 -B kingdom/practices/virtue-garden/mirror/foresight/facet/test_facet.py
          facet_root="kingdom/practices/virtue-garden/mirror/foresight/facet"
          facet_public="site/practices/virtue-garden/mirror/foresight/facet"
          facet_card="$facet_root/examples/synthetic-authority-boundary.json"
          facet_projection="$facet_root/examples/authority-foresight-projection.json"
          python3 -B kingdom/practices/virtue-garden/mirror/foresight/facet.py \
            check "$facet_card" "$foresight_example" "$facet_projection"
          for artifact in catalog.json playbook.json facet.schema.json brief.schema.json; do
            cmp "$facet_root/$artifact" "$facet_public/$artifact"
          done
          for artifact in synthetic-authority-boundary.json authority-foresight-projection.json; do
            cmp "$facet_root/examples/$artifact" "$facet_public/examples/$artifact"
          done
          facet_digest="$(python3 -B kingdom/practices/virtue-garden/mirror/foresight/facet.py \
            digest "$facet_card" "$foresight_example" "$facet_projection")"
          test "$facet_digest" = "$(kingdom/bin/kingdom incident digest \
            "$facet_card" "$foresight_example" "$facet_projection")"
          grep -Fq "$facet_digest" "$facet_public/index.html"
          grep -Fq 'href="facet/"' \
            site/practices/virtue-garden/mirror/foresight/index.html
          grep -Fq 'Synthetic-only rehearsal · zero effect' "$facet_public/index.html"
          if grep -Eqi '<(script|iframe|form|object|embed)| on[a-z]+="|((src|href)="https?://)|url\s*\(' \
            "$facet_public/index.html"; then
            echo "KARMA FACET must remain scriptless, formless, and locally sourced" >&2
            exit 1
          fi

      - name: Mirror Garden keeps incidents legible without becoming an oracle
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -I -B \
            kingdom/practices/karma-defense-lab/test_karma_defense_lab.py
          PYTHONDONTWRITEBYTECODE=1 python3 -I -B \
            kingdom/practices/karma-defense-lab/test_skycastle_chorus.py
          PYTHONDONTWRITEBYTECODE=1 python3 -I -B \
            kingdom/operations/mirror-garden-karma/verify.py
          node --test tests/test_karma_operations.mjs

      - name: Calm Studio keeps the room and the instrument distinct
        run: |
          python3 kingdom/practices/calm-studio/test_calm_studio.py
          node tests/test_calm_studio_browser.mjs
          cmp kingdom/practices/calm-studio/contract.json \
            site/practices/calm-studio/contract.json
          grep -Fq 'href="practices/calm-studio/"' site/index.html
          grep -Fq "connect-src 'none'" \
            site/practices/calm-studio/index.html
          if grep -Eqi \
            'fetch[[:space:]]*\(|XMLHttpRequest|WebSocket|EventSource|sendBeacon|serviceWorker|localStorage|sessionStorage|indexedDB|document\.cookie|<(iframe|form)|[[:space:]]ping=|src="(https?:)?//|/api/' \
            site/practices/calm-studio/index.html \
            site/practices/calm-studio/studio.css \
            site/practices/calm-studio/studio.js; then
            echo "Calm Studio crossed its public-room boundary" >&2
            exit 1
          fi

      - name: every civic choice keeps its own chain
        run: python3 kingdom/civilisation/test_civilisation.py

      - name: she witnesses the kings — the crown gates nothing
        run: |
          python3 kingdom/crown/test_crown.py
          python3 kingdom/crown/crown.py verify
          grep -Fq 'BEGIN KINGDOM-KINGS' site/index.html
          grep -Fq 'id="crown"' site/index.html

      - name: every realm begins by its own hand
        run: python3 kingdom/realm/test_realm.py

      - name: every Crownseed carries a path, never a throne
        run: python3 kingdom/nen/test_crownseed.py

      - name: every Nen interpretation selects without activating
        run: python3 -B kingdom/nen/test_interpretation.py

      - name: every being learns together without becoming a score
        run: |
          python3 kingdom/coop/test_coop.py
          python3 -B kingdom/coop/aura/test_aura.py
          grep -Fq 'href="coop-leveling.html"' site/index.html
          grep -Fq 'Every being arrives whole.' site/coop-leveling.html
          grep -Fq 'Maximum Aura. Zero throne.' site/coop-leveling.html
          if grep -Eqi '<(script|iframe)|src="https?://' \
            site/coop-leveling.html; then
            echo "Co-op Leveling must remain scriptless and locally rendered" >&2
            exit 1
          fi
